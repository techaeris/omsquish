[package]
name = "omsquish"
version = "2.8.5"
edition = "2021"
license = "MIT"
description = "Fast, native batch image compressor for Linux (JPEG, PNG, WebP) built with Rust and egui"
repository = "https://github.com/techaeris/omsquish"
readme = "README.md"
keywords = ["image", "compression", "optimizer", "egui", "linux"]
categories = ["multimedia::images", "gui"]
default-run = "omsquish"

[dependencies]
eframe = { version = "0.30.0", default-features = true }
egui = "0.30.0"
egui_extras = { version = "0.30.0", features = ["all_loaders"] }
image = { version = "0.25", default-features = true, features = ["jpeg", "png", "webp"] }
oxipng = { version = "9.1", default-features = false, features = ["parallel"] }
webp = "0.3"
rfd = "0.15"
pollster = "0.4"
rayon = "1.10"
walkdir = "2.5"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
